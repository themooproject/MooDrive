<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MooDrive</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(230, 230, 230);
    }
    header {
        color: black;
        display: flex;
        background-color: white;
        padding: 15px;
        align-items: center;
        gap: 20px;
    }

    header h1 {
        margin: 0;
    }

    header form {
        flex: 1;
        max-width: 500px;
        margin-left: 150px;
    }

    header form input {
        width: 900px;
        padding: 8px 15px;
        border: 1px solid #ddd;
        background-image: url(static/cow-texture.jpg);
        background-repeat: repeat;
        background-size: 60px;
        border-radius: 20px;
        font-size: 16px;
    }
    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 30px;
        width: 100%; /* Mude de 300px para 100% */
        height: 200px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: transform 0.2s;
        padding: 20px;
        box-sizing: border-box;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card h1 {
        margin: 5px 0;
        font-size: 1.2rem;
        word-break: break-word;
    }

    .card h1:first-child {
        font-size: 2.5rem;
    }

</style>
<body>
    <header>
        <h1>🐮 MooDrive</h1>
        <form action="/search" method="get">
            <input type="text" name="q" placeholder="🔍 Pesquisar arquivos..." value="{{ palavra_chave }}">
        </form>
    </header>
    <h1>Resultados da pesquisa</h1>
    <div class="cards">
        {% for arquivo in arquivos %}
            <div class="card">
                <h1>📁</h1>
                <h1> {{ arquivo }}</h1>
                <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <a href="/download/{{ arquivo }}" style="background: #4CAF50; color: white; padding: 5px 12px; border-radius: 15px; text-decoration: none; font-size: 12px;">⬇ Download</a>
                    <a href="/visualizar/{{ arquivo }}" target="_blank" style="background: #2196F3; color: white; padding: 5px 12px; border-radius: 15px; text-decoration: none; font-size: 12px;">👁 Visualizar</a>
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
